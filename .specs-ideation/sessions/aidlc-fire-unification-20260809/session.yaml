decisions:
  - "Recommend, don't enforce: dynamic bolt/run creation at any stage is AI-DLC-compatible; skills never force inception/construction sequences"
  - "New single artifact root for unified flow: docs/specsmd/ (visible docs folder, not dotfolder)"
  - "Container name: bolt (brand word retained, redefined as dynamic container; run stays a plain verb)"
  - "State model: markdown frontmatter AI-DLC style, no central state.yaml; scripts remain sole writers"
  - "CLAUDE.md rewritten 2026-08-09: strict fidelity rescoped to frozen legacy flow"
  - "Plugin name: specsmd (default install = unified flow = AI-DLC v2); companion flows as specsmd-* plugins; legacy specsmd-aidlc/-fire frozen"
  - "Branching: v1 immutable forever on its own branch + current npm package; all v2/skills work on new main-v2 branch"
  - "Website: existing URLs never break (SEO); v2 docs under /v2 on same site; site deploys from main-v2 carrying both doc sets"
  - "Intents are nlspecs: purely intent-focused natural language specs (strongdm attractor lineage) — no code snippets, file names, or technical design in intents/work items; technical detail belongs to the execution harness and bolt-time artifacts"
  - "Harness over prescription: specsmd = set intent + set guardrails via execution harness, agents do the work (OpenAI harness-engineering influence; research in flight)"
  - "Evals-first: verifiers and evals for the new flow are built BEFORE implementation starts"
  - "Research synthesis complete (6 agents): nlspec standard authored at docs/specsmd/standards/nlspec.md; study at memory-bank/research/nlspec-harness-study.md; work items rewritten as nlspecs; 000-flow-evals added"
  - "Memory lifecycle: two classes only — semantic (kept true forever, drift-gardened) and episodic (distillation-gated pruning, git history as archive); NO procedural class (skills/recipes are specsmd itself); memory class declared per artifact type in flow contract"
  - "Event-sourced memory ratified (2026-08-09): intents/work items/bolts are change records — semantic while active, episodic once complete; current truth lives in system/ layer (registered doc types with claimed scopes); projection at completion is ADVISORY (user choice), gardening catches misses; forgetting/archival stays gated on captured truth; decisions = immutable events + in-force index; episodic carries one-hop upward pointers to semantic"

