name: Evals holdout isolation

on:
  pull_request:
    branches: [main, main-v2, dev]
  push:
    branches: [main, main-v2, dev]

jobs:
  holdout:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune origin ${{ github.base_ref }}

      - name: Fetch push parent
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --prune origin ${{ github.event.before }} || true

      - name: Reject mixed evals and flow implementation changes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          EVALS_HOLDOUT_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node evals/holdout/run.cjs
